<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { justify-self: start; padding: 10px 18px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .error { margin: 10px 0 0; color: #ffb3c0; }
    .auth .signed-in { margin: 0 0 12px; color: #c9f2d6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>자료는 이제 코드가 아닌 데이터베이스에 있고, 서버 함수를 거쳐 읽습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">자료 API는 로그인 토큰을 검사합니다. 로그인하지 않은 방문자에게는 자료를 보내지 않습니다.</div>

    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form" hidden>
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="signed-in" id="signed-in-text"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p class="error" id="auth-error" role="alert" hidden></p>
    </section>

    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 3단계: Supabase Auth 이메일·비밀번호 로그인. 아래 두 값은 공개용입니다.
    // 서버 전용 secret key는 여기에 넣지 마세요.
    const SUPABASE_URL = 'https://xvttauolkmecdscuthnb.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kd_fyakyQIMSpZRt9jV40g_StdLWQgy';

    const form = document.querySelector('#login-form');
    const signedIn = document.querySelector('#signed-in');
    const signedInText = document.querySelector('#signed-in-text');
    const errorText = document.querySelector('#auth-error');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const password = document.querySelector('#password');
    const list = document.querySelector('#notes');

    const showMessage = message => {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    };
    // 로그인 토큰은 SDK가 발급한 access_token을 그대로 보냅니다. 화면은 userId·role을 보내지 않습니다.
    let loadId = 0;
    const loadNotes = async session => {
      const current = ++loadId;
      if (!session?.access_token) {
        showMessage('로그인하면 자료가 보입니다.');
        return;
      }
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (response.status === 401) throw new Error('로그인 확인에 실패해 자료를 보여 줄 수 없습니다. 다시 로그인해 주세요.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (current !== loadId) return;
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        if (current === loadId) showMessage(error.message);
      }
    };

    const showError = message => {
      errorText.textContent = message;
      errorText.hidden = !message;
    };
    const reasons = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않았습니다. 받은 편지함의 인증 메일을 확인하세요.',
      over_request_rate_limit: '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도하세요.',
      user_banned: '사용이 정지된 계정입니다.',
    };
    const reasonOf = error => reasons[error.code] ?? `로그인에 실패했습니다: ${error.message}`;

    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      showError('로그인 설정이 아직 없습니다. Project URL과 publishable key를 넣어 주세요.');
      showMessage('로그인하면 자료가 보입니다.');
    } else {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const render = session => {
        const user = session?.user;
        form.hidden = Boolean(user);
        signedIn.hidden = !user;
        signedInText.textContent = user ? `${user.email} 계정으로 로그인되어 있습니다.` : '';
        loadNotes(session);
      };

      supabase.auth.onAuthStateChange((_event, session) => render(session));
      const { data } = await supabase.auth.getSession();
      render(data.session);

      form.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        loginButton.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: password.value,
        });
        password.value = '';
        loginButton.disabled = false;
        if (error) showError(reasonOf(error));
      });

      logoutButton.addEventListener('click', async () => {
        showError('');
        logoutButton.disabled = true;
        const { error } = await supabase.auth.signOut();
        logoutButton.disabled = false;
        if (error) showError(`로그아웃에 실패했습니다: ${error.message}`);
      });
    }
  </script>
</body>
</html>
